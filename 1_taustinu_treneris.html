<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taustiņu treneris · 3. klase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Candara,Aptos,"Segoe UI",sans-serif;background:#dfe5ee;color:#1a1a2e;
     display:flex;align-items:center;justify-content:center;overflow:hidden}
#fit{position:relative}
#board{width:1280px;height:720px;transform-origin:center center;
       background:#fff;border-radius:16px;padding:20px 30px;display:flex;flex-direction:column;
       box-shadow:0 12px 34px rgba(31,78,121,.22)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-size:26px;color:#1F4E79}
.sub{font-size:14px;color:#5a6a7d}
.stats{display:flex;gap:8px}
.stat{background:#f2f5fa;border-radius:12px;padding:6px 14px;text-align:center;min-width:94px}
.stat b{display:block;font-size:20px;color:#C75000}
.stat span{font-size:11px;color:#5a6a7d}
.stat.time b{color:#1F4E79}
.stat.hide{visibility:hidden}
.rows{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:2px solid #1F4E79;background:#fff;color:#1F4E79;border-radius:999px;
      padding:4px 14px;font:inherit;font-size:14px;cursor:pointer}
.pill.on{background:#1F4E79;color:#fff}
.pill.lvl{border-color:#C75000;color:#C75000}
.pill.lvl.on{background:#C75000;color:#fff}
.pill.lvl.lock{border-color:#c5ccd6;color:#9aa4b2;background:#f4f6f9;cursor:not-allowed}
.pill.lvl.done{border-color:#2e7d32;color:#2e7d32}
.pill.lvl.done.on{background:#2e7d32;color:#fff}
.lbl{font-size:13px;color:#8a93a3}
.target{font-size:40px;text-align:center;padding:18px 26px;margin-top:18px;
        background:#f7f9fc;border:2px dashed #c8d4e6;border-radius:16px;height:142px;
        line-height:1.35;
        display:flex;align-items:center;justify-content:center;flex-wrap:wrap;overflow:hidden}
.target span{padding:0 1px;border-radius:4px}
.ok{color:#2e7d32}
.bad{color:#fff;background:#d32f2f}
.cur{background:#ffe08a;box-shadow:0 -3px 0 #C75000 inset}
.hint{text-align:center;font-size:17px;color:#C75000;height:26px;font-weight:bold;margin-top:10px}
.bar{height:9px;background:#e6ebf3;border-radius:999px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#1F4E79;width:0;transition:width .2s}
.done{text-align:center;font-size:17px;color:#2e7d32;font-weight:bold;height:30px;margin-top:4px}
.done button{margin-left:10px;background:#C75000;color:#fff;border:0;border-radius:8px;
             padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}

/* --- klaviatūra --- */
.kbwrap{margin-top:26px;background:#eceef1;border-radius:14px;padding:10px 0;
        box-shadow:inset 0 0 0 2px #dcdfe4;height:214px;overflow:hidden}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;
    transform:scale(.74);transform-origin:top center}
.row{display:flex;gap:6px}
.key{position:relative;width:52px;height:46px;border-radius:7px;background:#fafbfc;
     border:1px solid #c9ced6;box-shadow:0 2px 0 #c2c7cf;
     display:flex;align-items:center;justify-content:center;font-size:17px;color:#3b4453}
.key .tl{position:absolute;top:4px;left:7px;font-size:12px;color:#6b7481}
.key .bl{position:absolute;bottom:4px;left:7px;font-size:12px;color:#6b7481}
.key.w62{width:62px}.key.w76{width:76px}.key.w86{width:86px}.key.w104{width:104px}
.key.w94{width:94px}.key.w128{width:128px}.key.w136{width:136px}
.key.enter{width:128px}
.key.space{width:450px}
.key.hi{background:#C75000;border-color:#a94400;color:#fff;box-shadow:0 2px 0 #8c3900}
.key.hi .tl,.key.hi .bl{color:#ffdfcd}
.key.dead{background:#1F4E79;border-color:#173a5c;color:#fff;box-shadow:0 2px 0 #123048}
.key.dead .tl,.key.dead .bl{color:#cfe0f5}
.key.shift{background:#2E74B5;border-color:#245c90;color:#fff;box-shadow:0 2px 0 #1d4b76}
footer{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:14px;padding-top:10px}
footer img{height:58px;width:auto}
footer .cred{font-size:14px;color:#5a6a7d;text-align:left;line-height:1.35}
footer .cred b{display:block;color:#1F4E79;font-size:15px}
</style>
</head>

 "vidējs":["sniegpārsla","sniegavīrs","slēpes","ragaviņas","mētelis","šalle","pīrāgs","svētki","slidotava","ziemeļi"],

},
"Pavasaris":{

"Vasara":{

 "vidējs":["zemenes","mellenes","brīvdienas","saulains","peldēties","tauriņš","ziedlapa","siltums","makšķere","vasarnīca"],

   "Tēvs ar laivu brauc makšķerēt.","Saulē smiltis kļūst ļoti karstas.","Brīvdienās mēs ejam uz mežu.",

"Tautas pasakas":{

   "Lapsa gaidīja ilgi, bet gailis nenolaidās.","Vilks skrēja pa tumšu mežu.","Zaķis paslēpās aiz celma.",
   "Ķēniņam bija trīs dēli.","Jaunākais dēls bija pats gudrākais.","Vecmāmiņa cepa siltu maizi.",

};

/* Klaviatūra pēc parauga: divi apzīmējumi uz taustiņa (augšā un apakšā).
   Ķepiņu taustiņš ir pie Enter — augšā ", apakšā ' */
const ROWS = [
  [ {tl:"~",bl:"`"},{tl:"!",bl:"1"},{tl:"@",bl:"2"},{tl:"#",bl:"3"},{tl:"$",bl:"4"},{tl:"%",bl:"5"},
    {tl:"^",bl:"6"},{tl:"&",bl:"7"},{tl:"*",bl:"8"},{tl:"(",bl:"9"},{tl:")",bl:"0"},
    {tl:"_",bl:"-"},{tl:"+",bl:"="},{t:"Backspace",w:"w104"} ],
  [ {t:"Tab",w:"w94"},{k:"q"},{k:"w"},{k:"e"},{k:"r"},{k:"t"},{k:"y"},{k:"u"},{k:"i"},{k:"o"},{k:"p"},
    {tl:"{",bl:"["},{tl:"}",bl:"]"},{tl:"|",bl:"\\",w:"w62"} ],
  [ {t:"Caps",w:"w86"},{k:"a"},{k:"s"},{k:"d"},{k:"f"},{k:"g"},{k:"h"},{k:"j"},{k:"k"},{k:"l"},
    {tl:":",bl:";"},{tl:"\u0022",bl:"\u0027",dead:true},{t:"Enter",w:"enter"} ],
  [ {t:"Shift",w:"w136",shift:true},{k:"z"},{k:"x"},{k:"c"},{k:"v"},{k:"b"},{k:"n"},{k:"m"},
    {tl:"<",bl:","},{tl:">",bl:"."},{tl:"?",bl:"/"},{t:"Shift",w:"w136",shift:true} ],
  [ {t:"Ctrl",w:"w62"},{t:"Fn",w:"w62"},{t:"Win",w:"w62"},{t:"Alt",w:"w62"},{k:" ",t:"atstarpe",w:"space"},
    {t:"Alt",w:"w62"},{t:"Ctrl",w:"w62"} ]
];
const DIACRITIC = {"ā":"a","č":"c","ē":"e","ģ":"g","ī":"i","ķ":"k","ļ":"l","ņ":"n","š":"s","ū":"u","ž":"z"};

let errNow = false, deadPending = false, locked = false;
let theme = "Rudens", level = "viegls", list = [], idx = 0, pos = 0, typed = [],
    hits = 0, miss = 0, doneCount = 0, t0 = null, timer = null;

const $ = id => document.getElementById(id);

const LEVEL_ORDER = [["viegls","Viegls"],["vidējs","Vidējs"],["grūts","Grūts"]];
const progress = {};
Object.keys(DATA).forEach(t=>progress[t] = {"viegls":false, "vidējs":false, "grūts":false});

function unlocked(lv){
  if(typeof teacher !== "undefined" && teacher) return true;
  const p = progress[theme];
  if(lv === "viegls") return true;
  if(lv === "vidējs") return p["viegls"];
  return p["vidējs"];
}
function nextLevel(lv){ return lv === "viegls" ? "vidējs" : lv === "vidējs" ? "grūts" : null; }

function buildPills(){
  $("themes").innerHTML = "";
  Object.keys(DATA).forEach(t=>{
    const b = document.createElement("button");
    const p = progress[t];
    b.className = "pill" + (t===theme?" on":"");
    b.textContent = t + (p["viegls"] && p["vidējs"] && p["grūts"] ? " ✓" : "");
    b.onclick = ()=>{ theme = t; level = "viegls"; start(); };
    $("themes").appendChild(b);
  });
  $("levels").innerHTML = "";
  LEVEL_ORDER.forEach(l=>{
    const b = document.createElement("button");
    const open = unlocked(l[0]), done = progress[theme][l[0]];
    b.className = "pill lvl" + (done ? " done" : "") + (!open ? " lock" : "") + (l[0]===level ? " on" : "");
    b.textContent = (open ? "" : "🔒 ") + l[1] + (done ? " ✓" : "");
    b.onclick = ()=>{
      if(!open){ $("hint").textContent = "Vispirms izpildi iepriekšējo līmeni."; return; }
      level = l[0]; start();
    };
    $("levels").appendChild(b);
  });
}

function buildKeyboard(){
  const kb = $("kb"); kb.innerHTML = "";
  ROWS.forEach(row=>{
    const r = document.createElement("div"); r.className = "row";
    row.forEach(spec=>{
      const d = document.createElement("div");
      d.className = "key" + (spec.w ? " " + spec.w : "");
      if(spec.k !== undefined) d.dataset.base = spec.k;
      if(spec.shift) d.dataset.role = "shift";
      if(spec.dead) d.id = "deadkey";
      if(spec.k && spec.k !== " " && !spec.t){
        d.textContent = spec.k.toUpperCase();
      } else if(spec.t){
        d.textContent = spec.t;
      } else {
        d.innerHTML = '<span class="tl">' + spec.tl + '</span><span class="bl">' + spec.bl + '</span>';
      }
      r.appendChild(d);
    });
    kb.appendChild(r);
  });
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(){
  clearInterval(timer); timer = null; t0 = null;
  list = shuffle(DATA[theme][level]);
  idx = 0; hits = 0; miss = 0; doneCount = 0;
  $("done").textContent = "";
  $("sTime").textContent = "0:00";
  $("statTime").classList.toggle("hide", level !== "grūts");
  buildPills(); loadWord(); updateStats();
}

function goNext(){
  const nx = nextLevel(level);
  if(nx && unlocked(nx)){ level = nx; start(); }
}

function loadWord(){ pos = 0; typed = []; errNow = false; deadPending = false; locked = false; render(); }

function render(){
  const word = list[idx] || "";
  const t = $("target"); t.innerHTML = "";
  for(let i=0;i<word.length;i++){
    const s = document.createElement("span");
    s.textContent = word[i] === " " ? "␣" : word[i];
    if(i < pos) s.className = "ok";
    else if(i === pos) s.className = errNow ? "bad cur" : "cur";
    t.appendChild(s);
  }
  $("bar").style.width = (idx/list.length*100) + "%";
  highlight(word[pos]);
}

function clearKeys(){ document.querySelectorAll(".key").forEach(k=>k.classList.remove("hi","dead","shift")); }

function highlight(ch){
  clearKeys();
  $("hint").textContent = "";
  if(!ch) return;
  const low = ch.toLowerCase();
  const base = DIACRITIC[low] || low;
  const needDead = !!DIACRITIC[low];
  const needShift = (ch !== low && ch === ch.toUpperCase());

  document.querySelectorAll(".key").forEach(k=>{
    if(k.dataset.base === base) k.classList.add("hi");
    if(needShift && k.dataset.role === "shift") k.classList.add("shift");
  });
  if(needDead && $("deadkey")) $("deadkey").classList.add("dead");

  if(needDead && needShift)
    $("hint").textContent = "Spied ķepiņu taustiņu ' (pie Enter), atlaid, tad turi Shift un spied " + base.toUpperCase() + "  →  " + ch;
  else if(needDead)
    $("hint").textContent = "Spied ķepiņu taustiņu ' (pie Enter), atlaid, tad spied " + base.toUpperCase() + "  →  " + ch;
  else if(needShift)
    $("hint").textContent = "Lielais burts: turi Shift un spied " + base.toUpperCase();
}

function updateStats(){
  $("sDone").textContent = doneCount;
  const total = hits + miss;
  $("sAcc").textContent = (total ? Math.round(hits/total*100) : 100) + "%";
}

function fmt(s){ return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function tick(){ if(t0) $("sTime").textContent = fmt(Math.floor((Date.now()-t0)/1000)); }

const DEAD_KEYS = ["Dead", "'", "´", "`", "\u0027"];

document.addEventListener("keydown", e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.repeat) { e.preventDefault(); return; }          // turēts taustiņš netiek skaitīts vairākkārt
  if(locked) { e.preventDefault(); return; }            // pauze starp vārdiem
  const word = list[idx]; if(!word) return;
  if(e.key === "Backspace"){ e.preventDefault(); return; }

  const expected = word[pos];
  const expLow = expected.toLowerCase();
  const expDiac = DIACRITIC[expLow];                   // bāzes burts, ja gaidām garumzīmi/mīkstinājumu

  // Ķepiņu taustiņš: dažās klaviatūrās tas ir "Dead", citās uzreiz dod apostrofu.
  if(DEAD_KEYS.indexOf(e.key) >= 0){
    e.preventDefault();
    if(expDiac){
      deadPending = true;
      $("hint").textContent = "Labi! Tagad spied " + (expected === expected.toUpperCase() ? "Shift + " : "") + expDiac.toUpperCase();
    }
    return;
  }
  if(e.key.length !== 1 && e.key.normalize("NFC").length !== 1) return;
  e.preventDefault();

  if(level === "grūts" && !t0){ t0 = Date.now(); timer = setInterval(tick, 500); }

  const k = e.key.normalize("NFC");
  let ok = (k === expected);

  // Ja klaviatūra neapvieno ķepiņu ar burtu, pieņemam: ķepiņa + pareizais bāzes burts
  if(!ok && deadPending && expDiac){
    const upperOk = (expected === expLow) ? (k === expDiac) : (k === expDiac.toUpperCase());
    if(upperOk) ok = true;
  }
  deadPending = false;

  if(ok){
    hits++; errNow = false; pos++;
    if(pos >= word.length){
      doneCount++; idx++; updateStats();
      if(idx >= list.length){
        clearInterval(timer);
        let extra = "";
        if(level === "grūts" && t0) extra = " Tavs laiks: " + fmt(Math.floor((Date.now()-t0)/1000)) + ".";
        progress[theme][level] = true;
        const nx = nextLevel(level);
        buildPills();
        $("done").innerHTML = "Lieliski! Līmenis izpildīts." + extra +
          (nx ? "<button onclick='goNext()'>Nākamais līmenis &#8594;</button>"
              : " Visi trīs līmeņi šajā tēmā izpildīti — izvēlies citu tēmu!") +
          "<button onclick='start()' style='background:#1F4E79'>Atkārtot</button>";
        $("target").innerHTML = ""; $("bar").style.width = "100%"; $("hint").textContent = "";
        clearKeys();
        return;
      }
      locked = true;                                    // kamēr nāk nākamais vārds, taustiņi netiek skaitīti
      pos = word.length;
      const t = $("target");
      [...t.children].forEach(sp=>sp.className = "ok");
      setTimeout(loadWord, 350);
      return;
    }
    updateStats(); render();
    return;
  }

  // Kļūda: burts paliek sarkans, līdz ievada pareizo
  miss++; errNow = true;
  updateStats(); render();
  if(e.getModifierState && e.getModifierState("CapsLock") && k.toLowerCase() === expLow)
    $("hint").textContent = "Ieslēgts Caps Lock! Izslēdz to un mēģini vēlreiz.";
  else
    $("hint").textContent = "Nepareizs taustiņš — spied iekrāsoto taustiņu.";
});

buildKeyboard();
start();
fit();

/* ---- Skolotāja režīms: Ctrl + Shift + L atbloķē visus līmeņus (atkārtoti — atkal bloķē) ---- */
var teacher = false;
(function(){
  const badge = document.createElement("div");
  badge.textContent = "Skolotāja režīms";
  badge.style.cssText = "position:fixed;left:8px;bottom:6px;font:12px Candara,Aptos,sans-serif;" +
    "color:#fff;background:rgba(31,78,121,.75);padding:3px 9px;border-radius:999px;z-index:9999;display:none";
  document.body.appendChild(badge);
  document.addEventListener("keydown", e=>{
    if(e.ctrlKey && e.shiftKey && (e.code === "KeyL" || e.key.toLowerCase() === "l")){
      e.preventDefault(); e.stopImmediatePropagation();
      teacher = !teacher;
      badge.style.display = teacher ? "block" : "none";
      if(typeof buildPills === "function") buildPills();
    }
  }, true);
})();
</script>
